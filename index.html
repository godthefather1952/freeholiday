<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>FreeHoliday — Crypto Quarter-Hour Forecasts</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05070b;
  --panel:#0b1018;
  --line:#1d2735;
  --text:#f5f7fb;
  --muted:#8e99a8;
  --btc:#f7931a;
  --eth:#8fa8ff;
  --doge:#d8ad36;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 20% -10%,rgba(247,147,26,.10),transparent 32%),
    radial-gradient(circle at 80% 0%,rgba(143,168,255,.09),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Segoe UI,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.shell{width:min(100%,780px);margin:0 auto;padding:18px 12px 36px}
.hero{
  padding:18px 16px 16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(9,13,20,.96));
  box-shadow:0 18px 50px rgba(0,0,0,.24)
}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
h1{font-size:26px;line-height:1.08;letter-spacing:-.04em;margin:7px 0 7px}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.coin-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.coin{
  padding:6px 9px;border:1px solid var(--line);border-radius:999px;
  font-size:11px;font-weight:800;background:rgba(255,255,255,.025)
}
.coin.btc{color:var(--btc)} .coin.eth{color:var(--eth)} .coin.doge{color:var(--doge)}
.model{
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:0 14px 40px rgba(0,0,0,.20);
  margin:0 0 14px;
}
.model-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.018)
}
.model-name{font-size:13px;font-weight:850;letter-spacing:-.01em}
.model-product{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.btc{background:var(--btc)} .dot.eth{background:var(--eth)} .dot.doge{background:var(--doge)}
iframe{
  display:block;width:100%;height:900px;border:0;background:#070a10;
  overflow:hidden;
}
.footer{text-align:center;color:var(--muted);font-size:10px;line-height:1.5;padding:3px 10px 0}
@media (min-width:700px){
  .shell{padding:24px 18px 48px}
  .hero{padding:22px 20px 19px}
  h1{font-size:30px}
}
</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div class="eyebrow">Quarter-hour forecast dashboard</div>
    <h1>BTC · ETH · DOGE</h1>
    <p>Three independent 15-minute forecasting models running together on one continuous page.</p>
    <div class="coin-row" aria-label="Markets">
      <span class="coin btc">BTC / USD</span>
      <span class="coin eth">ETH / USD</span>
      <span class="coin doge">DOGE / USD</span>
    </div>
  </header>

  <section class="model">
    <div class="model-head">
      <div class="model-name"><span class="dot btc"></span>Sixcents</div>
      <div class="model-product">BTC-USD</div>
    </div>
    <iframe id="btcFrame" title="Sixcents Bitcoin forecast" src="sixcents.html" scrolling="no"></iframe>
  </section>

  <section class="model">
    <div class="model-head">
      <div class="model-name"><span class="dot eth"></span>Bandjovi</div>
      <div class="model-product">ETH-USD</div>
    </div>
    <iframe id="ethFrame" title="Bandjovi Ethereum forecast" src="bandjovi.html" scrolling="no"></iframe>
  </section>

  <section class="model">
    <div class="model-head">
      <div class="model-name"><span class="dot doge"></span>Solsister</div>
      <div class="model-product">DOGE-USD</div>
    </div>
    <iframe id="dogeFrame" title="Solsister Dogecoin forecast" src="solsister.html" scrolling="no"></iframe>
  </section>

  <div class="footer">Each model keeps its own history, calibration and prediction storage.</div>
</main>
<script>
(function(){
  var frames=[
    document.getElementById('btcFrame'),
    document.getElementById('ethFrame'),
    document.getElementById('dogeFrame')
  ];

  function fit(frame){
    try{
      var doc=frame.contentDocument || frame.contentWindow.document;
      if(!doc) return;
      var body=doc.body;
      var html=doc.documentElement;
      if(!body || !html) return;
      var h=Math.max(
        body.scrollHeight, body.offsetHeight,
        html.clientHeight, html.scrollHeight, html.offsetHeight
      );
      if(h>200) frame.style.height=(h+4)+'px';
    }catch(e){}
  }

  function fitAll(){
    for(var i=0;i<frames.length;i++) fit(frames[i]);
  }

  for(var i=0;i<frames.length;i++){
    (function(frame){
      frame.addEventListener('load',function(){
        fit(frame);
        setTimeout(function(){fit(frame)},300);
        setTimeout(function(){fit(frame)},1200);
        setTimeout(function(){fit(frame)},3500);
      });
    })(frames[i]);
  }

  window.addEventListener('resize',function(){setTimeout(fitAll,120)});
  setInterval(fitAll,2500);
})();
</script>
</body>
</html>
