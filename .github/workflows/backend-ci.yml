name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m py_compile backend/app.py backend/kalshi_client.py backend/store.py backend/risk.py
      - name: Import FastAPI application
        run: |
          export FREEHOLIDAY_FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          PYTHONPATH=backend python -c "import app; assert app.app.title == 'FreeHoliday Kalshi API'"
      - name: Run core tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_core.py
