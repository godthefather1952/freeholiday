name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m py_compile backend/app.py backend/kalshi_client.py backend/store.py backend/risk.py
      - name: Run core tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_core.py
